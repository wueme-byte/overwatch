
services:
  redis:
    image: redis:7-alpine
    # К4: потолок памяти, при нехватке вытесняются давно не нужные ключи (сервер 1 ГБ)
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    restart: always

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    ports:
      # К2: только для nginx и cloudflared на этом же сервере, не наружу
      - "127.0.0.1:8001:8001"
    # маркет Telegram: папка с сессией технического аккаунта и его ключами (на сервере
    # TG_HOST_DIR=/root/overwatch-tg задан в .env; локально — пустая ./tg-data, маркет выключен)
    volumes:
      - ${TG_HOST_DIR:-./tg-data}:/tg
    # В6: Docker раз в минуту спрашивает /health; три неудачи подряд — контейнер помечается unhealthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    depends_on:
      - redis
    restart: always

  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      - HTTPS_PROXY=
    depends_on:
      - redis
    restart: always
