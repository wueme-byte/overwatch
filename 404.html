<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages не знает адресов приложения (/search, /themes) и отдаёт эту страницу.
    // Переносим путь в параметры и открываем корень: index.html вернёт адрес обратно.
    // Корень всегда существует, поэтому зациклиться нельзя.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(l.pathname) +
      (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
      l.hash
    );
  </script>
</head>
</html>
